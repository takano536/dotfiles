name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pester 5 runs on Windows PowerShell 5.1 and PowerShell 7.
  PESTER_VERSION: 5.9.1
  # chezmoi is downloaded as a single binary: CI installs no package manager.
  CHEZMOI_VERSION: 2.72.0

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Windows PowerShell 5.1
        shell: powershell
        run: |
          $PSVersionTable.PSVersion
          if ($PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) {
              throw "install.ps1 is bootstrapped with Windows PowerShell 5.1, but this shell is $($PSVersionTable.PSVersion)."
          }

      - name: Install Pester for Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol =
              [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
          Install-Module Pester -RequiredVersion $env:PESTER_VERSION -Scope CurrentUser `
              -Force -SkipPublisherCheck

      - name: Install Pester for PowerShell 7
        shell: pwsh
        run: |
          # The two editions have separate module paths.
          $ErrorActionPreference = 'Stop'
          Install-Module Pester -RequiredVersion $env:PESTER_VERSION -Scope CurrentUser `
              -Force -SkipPublisherCheck

      - name: Install chezmoi
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:CHEZMOI_VERSION
          $target = Join-Path $env:RUNNER_TEMP 'chezmoi'
          $archive = Join-Path $env:RUNNER_TEMP 'chezmoi.zip'
          Invoke-WebRequest -UseBasicParsing -OutFile $archive -Uri `
              "https://github.com/twpayne/chezmoi/releases/download/v$version/chezmoi_${version}_windows_amd64.zip"
          Expand-Archive -LiteralPath $archive -DestinationPath $target -Force
          $target | Out-File -Append -Encoding ascii -FilePath $env:GITHUB_PATH

      - name: Test with Windows PowerShell 5.1
        shell: powershell
        run: |
          Import-Module Pester -RequiredVersion $env:PESTER_VERSION
          $result = Invoke-Pester -Path ./tests -Output Detailed -PassThru
          foreach ($test in $result.Failed) {
              Write-Host "::error title=$($test.ExpandedName)::$($test.ErrorRecord.DisplayErrorMessage)"
          }
          if ($result.FailedCount -gt 0) { exit 1 }

      - name: Test with PowerShell 7
        if: always()
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion $env:PESTER_VERSION
          $result = Invoke-Pester -Path ./tests -Output Detailed -PassThru
          foreach ($test in $result.Failed) {
              Write-Host "::error title=$($test.ExpandedName)::$($test.ErrorRecord.DisplayErrorMessage)"
          }
          if ($result.FailedCount -gt 0) { exit 1 }

      - name: Lint (errors only)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $findings = @('./install.ps1', './tests') | ForEach-Object {
              Invoke-ScriptAnalyzer -Path $_ -Recurse -Severity Error
          }
          $findings | Format-Table -AutoSize
          if ($findings) { exit 1 }

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check install.sh syntax
        run: bash -n ./install.sh

      - name: Lint install.sh (warnings and errors only)
        # ShellCheck is preinstalled on the GitHub runner image.
        run: shellcheck --severity=warning --shell=bash ./install.sh

      - name: Test the Linux installer
        # Plain bash, fake apt-get/sudo/curl/chezmoi, no package is installed.
        # Runs as a non-root user, so the sudo handling is covered here.
        run: bash ./tests/install.tests.sh

      - name: Install Pester and chezmoi
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module Pester -RequiredVersion $env:PESTER_VERSION -Scope CurrentUser -Force
          $version = $env:CHEZMOI_VERSION
          $target = Join-Path $env:RUNNER_TEMP 'chezmoi'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          $archive = Join-Path $env:RUNNER_TEMP 'chezmoi.tar.gz'
          Invoke-WebRequest -OutFile $archive -Uri `
              "https://github.com/twpayne/chezmoi/releases/download/v$version/chezmoi_${version}_linux_amd64.tar.gz"
          tar -xzf $archive -C $target
          $target | Out-File -Append -FilePath $env:GITHUB_PATH

      - name: Smoke test the dotfiles
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion $env:PESTER_VERSION
          $result = Invoke-Pester -Path ./tests/Dotfiles.Tests.ps1 -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) { exit 1 }

  # One path through a real Debian 13 userland, because that is what install.sh
  # officially supports: root is refused, and the contract tests and the plan
  # then run as an unprivileged user. It still installs no package and applies
  # nothing; the container only proves that the distribution gate and the plan
  # work on the real /etc/os-release with the tools Debian ships by default.
  debian:
    runs-on: ubuntu-latest
    container:
      image: debian:13
    steps:
      - uses: actions/checkout@v4

      - name: Show the userland under test
        run: |
          cat /etc/os-release
          bash --version | head -n 1

      - name: Check install.sh syntax
        run: bash -n ./install.sh

      - name: Refuse to run as root
        # The container's default user is root, which is what install.sh has to
        # reject: it applies dotfiles into the calling user's home directory.
        run: |
          if bash ./install.sh --dry-run; then
              echo 'install.sh should have refused to run as root' >&2
              exit 1
          fi

      - name: Create an unprivileged user
        # install.sh is meant to be run by the user who owns the dotfiles, so
        # everything below runs as a normal user, like on a real machine.
        run: |
          useradd --create-home tester
          chown -R tester "$GITHUB_WORKSPACE"

      - name: Test the Linux installer
        run: su tester -c 'bash ./tests/install.tests.sh'

      - name: Plan a bootstrap without changing anything
        run: |
          su tester -c 'bash ./install.sh --dry-run'
          # A dry run must not install anything, so chezmoi must still be absent.
          if command -v chezmoi >/dev/null 2>&1; then
              echo '--dry-run installed chezmoi' >&2
              exit 1
          fi

      # The only test that uses the real remote: it proves that the clone URL
      # and the branch install.sh names exist and that a machine without a
      # checkout can bootstrap from the piped installer. Packages are still not
      # installed, and everything lands in a throwaway home.
      - name: Bootstrap without a checkout, over the real remote
        run: |
          set -o pipefail
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates curl >/dev/null
          cp ./install.sh /tmp/install.sh
          chmod 0755 /tmp/install.sh
          # A path with a space, because the bootstrap has to quote it.
          install -d -o tester /tmp/bootstrap-home '/tmp/bootstrap data'
          su tester -c 'HOME=/tmp/bootstrap-home XDG_DATA_HOME="/tmp/bootstrap data" bash -s -- --skip-packages' </tmp/install.sh
          test -f '/tmp/bootstrap data/chezmoi/.chezmoiroot'
          test -x /tmp/bootstrap-home/.local/bin/chezmoi
          test -f /tmp/bootstrap-home/.bashrc

          # A second run reuses the clone instead of cloning again. Its output
          # goes to a file: 'grep -q' would close the pipe on the first match
          # and the installer would die of SIGPIPE.
          su tester -c 'HOME=/tmp/bootstrap-home XDG_DATA_HOME="/tmp/bootstrap data" bash -s -- --skip-packages' </tmp/install.sh | tee /tmp/second-run.log
          grep -q 'using the existing checkout' /tmp/second-run.log
